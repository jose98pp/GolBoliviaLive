name: Android TV and tablet APK
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'serverApp.ts', 'src/services/firebase.ts', 'src/services/liveEventCatalog.ts', 'scripts/test-live-catalog.ts', 'src/services/iptvBackend.ts', 'scripts/test-playback-resolution.ts']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'serverApp.ts', 'src/services/firebase.ts', 'src/services/liveEventCatalog.ts', 'scripts/test-live-catalog.ts', 'src/services/iptvBackend.ts', 'scripts/test-playback-resolution.ts']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests, lint and debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GolBoliviaLive-TV-tablet-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html

  catalog-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Catalog regression without production access
        run: |
          bun scripts/test-live-catalog.ts
          bun scripts/test-playback-resolution.ts

  interface-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: GolBoliviaLive-TV-tablet-debug
          path: /tmp/golbolivia-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 android/scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-interface-smoke
          path: android-smoke/
