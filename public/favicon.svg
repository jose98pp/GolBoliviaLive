<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="boliviaTrigradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="24" fill="#070b14" />
  <circle cx="50" cy="50" r="42" fill="url(#badgeGlow)" />

  <!-- Tricolor Border Ring -->
  <rect x="6" y="6" width="88" height="88" rx="20" stroke="url(#boliviaTrigradient)" stroke-width="4" stroke-opacity="0.9" />

  <!-- Soccer Ball & Radio Wave Motif -->
  <circle cx="50" cy="50" r="26" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Ball Pentagons -->
  <polygon points="50,38 58,44 55,53 45,53 42,44" fill="#10b981" />
  <line x1="50" y1="38" x2="50" y2="28" stroke="#334155" stroke-width="2" />
  <line x1="58" y1="44" x2="68" y2="40" stroke="#334155" stroke-width="2" />
  <line x1="55" y1="53" x2="62" y2="61" stroke="#334155" stroke-width="2" />
  <line x1="45" y1="53" x2="38" y2="61" stroke="#334155" stroke-width="2" />
  <line x1="42" y1="44" x2="32" y2="40" stroke="#334155" stroke-width="2" />

  <!-- Live Pulse Dot -->
  <circle cx="78" cy="22" r="6" fill="#ef4444" />
  <circle cx="78" cy="22" r="10" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
